<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Cửa Ải Toán Học</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Lớp nền chữ THỬ NGHIỆM mờ mờ khắp màn hình cho cả ĐT và Máy tính */
        .watermark-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: space-around;
            justify-content: space-around;
            opacity: 0.12; /* Độ mờ */
            overflow: hidden;
        }

        .watermark-text {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            transform: rotate(-25deg);
            user-select: none;
            white-space: nowrap;
            padding: 20px;
        }

        /* Đảm bảo các thành phần chính nằm đè lên lớp watermark */
        .ba-khi-box, .admin-menu-toggle, .admin-panel, .header-container, .grid-container, .modal-overlay {
            z-index: 5;
        }

        /* Hộp hiển thị Bá Khí ở góc trên bên phải */
        .ba-khi-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #f1c40f;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* Vùng tàng hình ở góc dưới bên trái */
        .admin-menu-toggle {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 35px;
            height: 35px;
            background: transparent;
            border: none;
            cursor: default;
            z-index: 1000;
        }

        /* Bảng Menu Admin ẩn/hiện (Có thể kéo thả) */
        .admin-panel {
            position: fixed;
            bottom: 40px;
            left: 10px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #e74c3c;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            z-index: 1001;
            display: none;
            width: 260px;
        }
        
        /* Phần tiêu đề để kéo thả */
        .admin-header {
            cursor: move;
            user-select: none;
        }

        .admin-panel h3 {
            margin: 0 0 10px 0;
            color: #e74c3c;
            font-size: 16px;
            text-align: center;
            text-transform: uppercase;
        }
        .admin-btn {
            width: 100%;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .admin-btn:hover { background: #c0392b; }
        #answer-viewer {
            font-size: 13px;
            color: #f1c40f;
            background: #222;
            padding: 8px;
            border-radius: 5px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 5px;
            white-space: pre-line;
            text-align: center;
        }

        /* Phần chữ xuất hiện phía trên lưới */
        .header-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .main-title {
            font-size: 28px;
            font-weight: bold;
            color: #f1c40f;
            text-transform: uppercase;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }

        .sub-title {
            font-size: 16px;
            color: #00ffff;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Màu các cấp độ */
        .c-lv1 { background: #3498db; } /* 1-10 */
        .c-lv2 { background: #2ecc71; } /* 11-30 */
        .c-lv3 { background: #e67e22; } /* 31-40 */
        .c-lv4 { background: #9b59b6; } /* 41-50 */

        /* Lưới 50 hình tròn */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 900px;
        }

        .circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            user-select: none;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .circle:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .circle.solved {
            background: #f1c40f !important;
            color: #333;
            text-shadow: none;
            border: 3px solid #fff;
            cursor: not-allowed;
        }
        
        .circle.solved:hover {
            transform: none;
        }

        /* Cửa sổ Popup (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: #fff;
            color: #333;
            width: 450px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            z-index: 1005;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #e74c3c;
            text-transform: uppercase;
        }

        #math-question {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #ddd;
            white-space: pre-line;
        }

        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #3498db;
            border-radius: 6px;
            outline: none;
            text-align: center;
            font-weight: bold;
        }

        .btn-submit {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #219653; }
        
        .btn-submit:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .btn-close {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
        }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 20px;
        }

        /* Responsive cho điện thoại di động */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                padding: 15px;
                max-width: 100%;
            }
            .circle {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
            .watermark-text {
                font-size: 11px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Lớp nền chữ THỬ NGHIỆM phủ khắp màn hình -->
    <div class="watermark-bg" id="watermarkBg"></div>

    <!-- Vùng tàng hình ở góc dưới bên trái -->
    <div class="admin-menu-toggle" onclick="toggleAdminMenu()"></div>

    <!-- Bảng Điều Khiển Admin -->
    <div class="admin-panel" id="adminPanel" onmousemove="resetInactivityTimer()" onclick="resetInactivityTimer()">
        <div class="admin-header" id="adminHeader">
            <h3>Bảng Điều Khiển</h3>
        </div>
        <button class="admin-btn" onclick="autoSolveAll()">🚀 Auto Hoàn Thành Tất Cả</button>
        <button class="admin-btn" onclick="revealAnswer()">👁️ Soi Đáp Án Câu Này</button>
        <div id="answer-viewer">Chưa mở câu hỏi nào...</div>
    </div>

    <!-- Khung hiển thị Bá Khí ở góc trên bên phải -->
    <div class="ba-khi-box">
        Bá khí: <span id="ba-khi-score">0</span>
    </div>

    <!-- Phần chữ xuất hiện phía trên lưới -->
    <div class="header-container">
        <div class="main-title">câu hỏi của heafzedd</div>
        <div class="sub-title">giải hết = pro + bá khí aura</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <!-- Cửa sổ hiển thị câu hỏi -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 id="modal-title">CÂU HỎI X</h2>
            <div id="math-question">Đang tải câu hỏi...</div>
            <input type="text" id="answer-input" placeholder="Nhập đáp án của bạn vào đây..." autocomplete="off">
            <br>
            <button class="btn-submit" id="submit-btn" onclick="checkAnswer()">Trả Lời</button>
            <button class="btn-close" onclick="closeModal()">Đóng</button>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        // Tự động tạo chữ "THỬ NGHIỆM" phủ kín màn hình
        const watermarkBg = document.getElementById('watermarkBg');
        for (let i = 0; i < 40; i++) {
            const span = document.createElement('span');
            span.classList.add('watermark-text');
            span.innerText = "THỬ NGHIỆM";
            watermarkBg.appendChild(span);
        }

        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const questionDisplay = document.getElementById('math-question');
        const answerInput = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const feedback = document.getElementById('feedback');
        const baKhiScoreDisplay = document.getElementById('ba-khi-score');
        
        let currentQuestionAnswer = null;
        let currentCircleId = null;
        let baKhiScore = 0; 
        let solvedCount = 0;
        let isProcessing = false;
        let isAdminUnlocked = false;
        let inactivityTimer = null;

        function updateBaKhiDisplay() {
            baKhiScoreDisplay.innerText = baKhiScore.toLocaleString();
        }

        // Khởi tạo 50 hình tròn
        for (let i = 1; i <= 50; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            circle.innerText = i;
            circle.id = 'circle-' + i;

            if (i <= 10) circle.classList.add('c-lv1');
            else if (i <= 30) circle.classList.add('c-lv2');
            else if (i <= 40) circle.classList.add('c-lv3');
            else circle.classList.add('c-lv4');

            circle.onclick = () => openQuestion(i);
            grid.appendChild(circle);
        }

        // Bắt sự kiện Enter khi nhập đáp án
        answerInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkAnswer();
            }
        });

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // MỞ CÂU HỎI THEO CẤP ĐỘ
        function openQuestion(id) {
            let circle = document.getElementById('circle-' + id);
            if (circle.classList.contains('solved')) {
                return;
            }

            currentCircleId = id;
            modalTitle.innerText = `CÂU HỎI ${id}`;
            answerInput.value = "";
            feedback.innerText = "";
            
            answerInput.disabled = false;
            submitBtn.disabled = false;
            isProcessing = false;

            let qText = "";
            let qAns = 0;

            if (id <= 10) {
                let type = rand(1, 3);
                if (type === 1) {
                    let a = rand(10, 40);
                    let b = rand(1, 15);
                    let c = rand(1, 10);
                    qText = `${a} - ${b} + ${c} = ?`;
                    qAns = a - b + c;
                } else if (type === 2) {
                    let a = rand(5, 20);
                    let b = rand(2, 6);
                    let c = rand(1, 10);
                    qText = `${a} + ${b} × ${c} = ?`;
                    qAns = a + (b * c);
                } else {
                    let x = rand(1, 20);
                    let b = rand(5, 25);
                    let a = x + b;
                    qText = `Tìm X biết:\nX + ${b} = ${a}`;
                    qAns = x;
                }
            } 
            else if (id <= 30) {
                let type = rand(1, 3);
                if (type === 1) {
                    let a = rand(20, 90);
                    let b = rand(2, 9);
                    let c = rand(5, 30);
                    qText = `${a} - ${b} × ${c} = ?`;
                    qAns = a - (b * c);
                } else if (type === 2) {
                    let x = rand(2, 12);
                    let b = rand(3, 10);
                    let c = rand(10, 50);
                    let a = (b * x) + c;
                    qText = `Tìm X biết:\n${b} × X + ${c} = ${a}`;
                    qAns = x;
                } else {
                    let a = rand(10, 50);
                    let b = rand(2, 10);
                    let c = rand(2, 8);
                    qText = `(${a} + ${b}) ÷ ${c} = ?`;
                    qAns = (a + b) / c;
                }
            }
            else if (id <= 40) {
                let type = rand(1, 3);
                if (type === 1) {
                    let a = rand(2, 9);
                    let b = rand(5, 20);
                    let c = rand(2, 8);
                    qText = `(${a}X - ${b}) ÷ ${c} = 2\nTìm X = ?`;
                    qAns = (2 * c + b) / a;
                } else if (type === 2) {
                    let p = rand(10, 50);
                    let val = rand(2, 10) * 20;
                    let total = val * 100 / p;
                    qText = `Biết ${p}% của một số bằng ${val}.\nHỏi số đó bằng bao nhiêu?`;
                    qAns = total;
                } else {
                    let n = rand(3, 9);
                    qText = `Tính tổng dãy số:\n1 + 2 + 3 + ... + ${n} = ?`;
                    qAns = (n * (n + 1)) / 2;
                }
            }
            else {
                let type = rand(1, 4);
                if (type === 1) {
                    let a = rand(2, 5);
                    let b = rand(1, 6);
                    qText = `Cho hàm số f(x) = ${a}x³ - ${b}x.\nTính đạo hàm f'(2) = ?`;
                    qAns = a * 3 * (2 * 2) - b;
                } else if (type === 2) {
                    let a = rand(2, 6);
                    qText = `Tính giới hạn:\nlim(x→3) [ (x² - 9) / (x - 3) ] = ?`;
                    qAns = 6;
                } else if (type === 3) {
                    let r = rand(2, 5);
                    qText = `Tính diện tích hình tròn có bán kính R = ${r}.\n(Lấy pi = 3, kết quả làm tròn hoặc ghi số nguyên gần nhất)`;
                    qAns = Math.round(3 * r * r);
                } else {
                    let a = rand(2, 5);
                    let b = rand(2, 5);
                    qText = `Tính thể tích hình hộp chữ nhật\nco các cạnh lần lượt là ${a}, ${b}, ${a}`;
                    qAns = a * b * a;
                }
            }

            questionDisplay.innerText = qText;
            currentQuestionAnswer = qAns;
            modal.style.display = 'flex';
            setTimeout(() => answerInput.focus(), 100);

            updateAdminAnswerViewer();
        }

        // KIỂM TRA ĐÁP ÁN
        function checkAnswer() {
            if (isProcessing) return;
            if (answerInput.value.trim() === "") return;
            
            isProcessing = true;
            answerInput.disabled = true;
            submitBtn.disabled = true;

            let userAns = parseFloat(answerInput.value.trim());
            let circle = document.getElementById('circle-' + currentCircleId);

            if (Math.abs(userAns - currentQuestionAnswer) < 0.001) {
                if (currentCircleId === 50) {
                    baKhiScore += 2000000;
                    feedback.style.color = "#2ecc71";
                    feedback.innerText = " +2,000,000 Bá Khí (CÂU 50)";
                } else {
                    baKhiScore += 999999;
                    feedback.style.color = "#2ecc71";
                    feedback.innerText = " +999,999 Bá Khí";
                }

                updateBaKhiDisplay();

                circle.classList.add('solved');
                circle.innerText = "✔";
                solvedCount++;

                setTimeout(() => {
                    closeModal();
                    if (solvedCount === 50) {
                        alert("👑 CHÚNG MỪNG BẠN! BẠN ĐÃ HOÀN THÀNH XUẤT SẮC 50 CỬA ẢI TOÁN HỌC VÀ NHẬN THƯỞNG 2 TRIỆU BÁ KHÍ!\n🔥 Đích thực là PRO TOÀN NĂNG - BÁ KHÍ AURA TỎA SÁNG RỰC RỠ! 🚀");
                    }
                }, 800);

            } else {
                baKhiScore -= 99999;
                updateBaKhiDisplay();

                feedback.style.color = "#e74c3c";
                feedback.innerText = "❌  -99,999 Bá Khí";

                setTimeout(() => {
                    closeModal();
                }, 800);
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // --- CÁC HÀM ADMIN ---
        function toggleAdminMenu() {
            const panel = document.getElementById('adminPanel');
            
            if (!isAdminUnlocked) {
                let password = prompt("Nhập mật khẩu Admin:");
                if (password === "123456789HeafZedd") {
                    isAdminUnlocked = true;
                    alert("🔓 Đăng nhập Admin thành công!");
                } else {
                    if (password !== null) {
                        alert("❌ Sai mật khẩu!");
                    }
                    return;
                }
            }

            if (panel.style.display === 'block') {
                closeAdminPanel();
            } else {
                panel.style.display = 'block';
                updateAdminAnswerViewer();
                startInactivityTimer();
            }
        }

        function closeAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = 'none';
            isAdminUnlocked = false; 
            clearTimeout(inactivityTimer);
        }

        function startInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                closeAdminPanel();
            }, 20000); 
        }

        function resetInactivityTimer() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'block') {
                startInactivityTimer();
            }
        }

        function updateAdminAnswerViewer() {
            let viewer = document.getElementById('answer-viewer');
            if (currentQuestionAnswer !== null && currentCircleId !== null) {
                viewer.innerText = `💡 Câu ${currentCircleId}: ${currentQuestionAnswer}`;
            } else {
                viewer.innerText = "⚠️ Hãy bấm mở 1 câu hỏi bất kỳ trước!";
            }
        }

        function revealAnswer() {
            resetInactivityTimer();
            if (currentQuestionAnswer !== null && currentCircleId !== null) {
                answerInput.value = currentQuestionAnswer;
                document.getElementById('answer-viewer').innerText = `💡 Đã điền đáp án câu ${currentCircleId}: ${currentQuestionAnswer}`;
            } else {
                alert("⚠️ Hãy mở một câu hỏi trước khi soi đáp án!");
            }
        }

        function autoSolveAll() {
            resetInactivityTimer();
            if(!confirm("Bạn có chắc chắn muốn auto hoàn thành toàn bộ 50 cửa ải không?")) return;
            
            for (let i = 1; i <= 50; i++) {
                let circle = document.getElementById('circle-' + i);
                if (!circle.classList.contains('solved')) {
                    circle.classList.add('solved');
                    circle.innerText = "✔";
                    solvedCount++;
                }
            }
            baKhiScore += (49 * 999999) + 2000000;
            updateBaKhiDisplay();
            alert("👑 ĐÃ AUTO HOÀN THÀNH XUẤT SẮC 50 CỬA ẢI VÀ NHẬN THƯỞNG 2 TRIỆU BÁ KHÍ!");
            closeAdminPanel();
        }

        // --- TÍNH NĂNG KÉO THẢ BẢNG ADMIN ---
        const adminPanel = document.getElementById('adminPanel');
        const adminHeader = document.getElementById('adminHeader');
        let isDragging = false;
        let offsetX, offsetY;

        adminHeader.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - adminPanel.offsetLeft;
            offsetY = e.clientY - adminPanel.offsetTop;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            if (!isDragging) return;
            adminPanel.style.left = (e.clientX - offsetX) + 'px';
            adminPanel.style.top = (e.clientY - offsetY) + 'px';
            adminPanel.style.bottom = 'auto'; 
        }

        function onMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
    </script>
</body>
</html>
